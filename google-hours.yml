# Holt täglich die Öffnungszeiten aus Google und aktualisiert hours.json
# Benötigt: Secret GOOGLE_PLACES_KEY und Variable GOOGLE_PLACE_ID (Settings > Secrets and variables > Actions)
name: Google-Öffnungszeiten

on:
  schedule:
    - cron: '15 2 * * *'   # täglich ca. 3:15 / 4:15 Uhr deutscher Zeit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Öffnungszeiten abrufen
        run: node .github/scripts/google-hours.js
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          GOOGLE_PLACE_ID: ${{ vars.GOOGLE_PLACE_ID }}
      - name: hours.json committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add hours.json
          git diff --cached --quiet || (git commit -m "Öffnungszeiten aus Google aktualisiert" && git push)
